# cargo-mutants configuration. Method: the `rust-mutation-testing` skill; this crate's
# numbers and decisions are in AGENTS.md, "Mutation testing".

# The `jj` backend's tests are `#[ignore]`d because they need the jj CLI. Without them every
# mutant in src/vcs/jj.rs would come back MISSED, so mutation runs include them and need jj
# on PATH (CI installs it).
additional_cargo_test_args = ["--", "--include-ignored"]

exclude_re = [
    # Equivalent. After a truncation `i` resumes at `start + head + 1 + tail`, the first
    # index past the kept tail. Either `* 1` mutant moves it back one, into the tail, and a
    # rescan from there sees an unchanged run of at most one line, which never truncates.
    # Anchored by line and column because the other `+ with *` mutants in this function
    # are real. If the line moves this stops matching and the mutants reappear as MISSED,
    # which is the loud direction: re-anchor it then.
    '^src/output/truncate\.rs:31:(30|34): replace \+ with \* in truncate_unchanged_runs$',
    # Equivalent. The empty-string guard is a shortcut: with `&&`, one empty side splits
    # into no words, so `common` is 0 and the function still returns 0.0 (and two
    # whitespace-only names split to nothing on both sides and also give 0.0).
    'replace \|\| with && in name_similarity$',
    # Equivalent while `Stats::from_file_diffs` never counts `modified` (it is always 0,
    # see TODO.md): `modified < 0` and `modified > 0` are both false for it. Anchored by
    # line like the truncate exclusion, because the same mutant on the other counts is real.
    '^src/output/mod\.rs:113:23: replace > with < in push_stats_header$',
    # Equivalent. The skip in `collect_compact_lines` is a shortcut: any node that is not
    # Unchanged has changes, so under `!=` nothing is skipped, and an unchanged node with
    # no changes prints nothing and has no changed descendants to print.
    '^src/output/mod\.rs:\d+:\d+: replace == with != in collect_compact_lines$',
    # Equivalent. `paths.len() < 4` only picks serial reads or rayon; both read each path
    # the same way and map any failure to None, so the result is identical either side.
    'replace < with (==|>|<=) in <impl Vcs for JjVcs>::files_at_revision$',
]
