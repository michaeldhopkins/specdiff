# Standalone workspace (see the empty `[workspace]` below): the root
# `cargo build` / `test` / `clippy` / `deny` never see it, so the main crate stays
# on stable while this builds only under `cargo fuzz`, which needs nightly for
# `-Zsanitizer`.

[package]
name = "specdiff-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anyhow = "1"
clap = "4"

[dependencies.specdiff]
path = ".."

[workspace]

# Line-level debug info so a crash stack trace names the specdiff function.
[profile.release]
debug = 1

[[bin]]
name = "outline"
path = "fuzz_targets/outline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outline_diff"
path = "fuzz_targets/outline_diff.rs"
test = false
doc = false
bench = false
