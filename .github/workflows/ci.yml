name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked

      # Integration tests included: tests/file_length.rs and tests/fuzz_targets_wired.rs
      # only gate anything if CI runs them.
      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny
        run: cargo deny check

  differential:
    name: Differential (outline vs each framework's own listing)
    runs-on: ubuntu-latest
    env:
      SPECDIFF_DIFFERENTIAL_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install minitest
        run: gem install minitest -v 6.0.6

      - name: cargo test --test differential
        run: cargo test --locked --test differential -- --ignored --nocapture
