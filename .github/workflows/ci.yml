name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked

      # Integration tests included: tests/file_length.rs and tests/fuzz_targets_wired.rs
      # only gate anything if CI runs them.
      - name: cargo test
        run: cargo test --locked

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny
        run: cargo deny check

  # rust-toolchain.toml pins the newest stable, so nothing else builds on the
  # rust-version that crates.io users are promised. Read from Cargo.toml so the
  # two cannot disagree.
  msrv:
    name: MSRV (cargo check on Cargo.toml's rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo +${{ steps.msrv.outputs.version }} check --locked

  differential:
    name: Differential (outline vs each framework's own listing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPECDIFF_DIFFERENTIAL_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install minitest
        run: gem install minitest -v 6.0.6

      - name: cargo test --test differential
        run: cargo test --locked --test differential -- --ignored --nocapture

  system-libgit2:
    name: No system libgit2 (macOS with Homebrew libgit2)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Homebrew libgit2
        run: brew install libgit2

      - name: cargo test --test no_system_libgit2
        run: cargo test --locked --test no_system_libgit2
