name: Mutants

# Mutation testing: cargo-mutants inserts plausible bugs and reports the ones no test
# notices. Method: the `rust-mutation-testing` skill; specdiff's numbers are in AGENTS.md,
# "Mutation testing". Neither job gates anything: a MISSED mutant is a finding to act on,
# not a broken build.
#
# - in-diff (pushes to main and PRs): mutants in the lines this change touched.
# - slice (pushes to main only): one of SHARDS slices of the whole tree, advancing with
#   the run number, so old code keeps being looked at without any job running long.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # jj's tests are #[ignore]d and .cargo/mutants.toml runs them, so jj must be on PATH or
  # the baseline fails. Pinned so a jj release cannot change what these jobs report.
  JJ_VERSION: v0.45.1

jobs:
  in-diff:
    name: Mutants in changed code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Install jj
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m755 "$tmp/jj" "$HOME/.local/bin/jj"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jj" --version

      # A PR diffs against its base; a push against the commit it replaced (or its first
      # parent when the branch is new and `before` is all zeros).
      #
      # The prefixes are forced because `diff.mnemonicPrefix` makes git write `i/` and `w/`,
      # which cargo-mutants does not recognise: it selects nothing and exits 0, a silent pass.
      - name: Compute diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          echo "Diffing against $base"
          git -c diff.mnemonicPrefix=false -c diff.noprefix=false diff "$base".. > mutants.diff
          wc -l mutants.diff
          if [ -s mutants.diff ] && ! grep -q '^diff --git a/' mutants.diff; then
            echo "::error::diff lacks a/ b/ prefixes; cargo-mutants would silently match nothing"
            head -3 mutants.diff
            exit 1
          fi

      # Exit codes: 2 a mutant was MISSED (the finding), 3 one timed out (usually an
      # injected infinite loop, a real result, so counted as caught and passed), 4 the
      # baseline failed, 5 or 6 the diff does not match the tree or is malformed (a bug in
      # this workflow, not in specdiff).
      - name: Mutants
        id: mutants
        run: |
          set -euo pipefail
          echo ran > mutants-status.txt
          if [ ! -s mutants.diff ]; then
            echo empty > mutants-status.txt
            echo "::notice::empty diff, nothing to mutate"
            exit 0
          fi
          selected=$(cargo mutants --list --in-diff mutants.diff | wc -l)
          echo "$selected" > mutants-selected.txt
          echo "Selected $selected mutants in changed regions"
          if [ "$selected" -eq 0 ]; then
            echo none > mutants-status.txt
            echo "::notice::no mutants overlap the changed regions (a test- or docs-only change)"
            exit 0
          fi
          # A reformat or mass refactor selects most of the tree and would outrun the job
          # timeout; the rotating slice covers that code over time instead.
          MAX_SELECTED=80
          if [ "$selected" -gt "$MAX_SELECTED" ]; then
            echo skipped > mutants-status.txt
            echo "::warning::Mutants skipped: $selected selected, over the limit of $MAX_SELECTED. Nothing was mutation-tested for this change."
            exit 0
          fi
          rc=0
          cargo mutants --no-shuffle -vV -j2 --in-diff mutants.diff || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice::timeouts counted as caught; see mutants.out/timeout.txt"
            rc=0
          fi
          exit "$rc"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          status="$(cat mutants-status.txt 2>/dev/null || echo unknown)"
          selected="$(cat mutants-selected.txt 2>/dev/null || echo '?')"
          {
            echo '## Mutants in changed code'
            echo
            case "$status" in
              empty) echo 'Empty diff. Nothing was mutation-tested.' ;;
              none) echo 'No mutants overlap the changed regions (test- or docs-only change). Nothing was mutation-tested.' ;;
              skipped) echo "**Skipped: $selected mutants selected, over the limit. Nothing was mutation-tested.**" ;;
              unknown) echo '**An earlier step failed. Nothing was mutation-tested.**' ;;
              *)
                if [ ! -d mutants.out ]; then
                  echo '**cargo-mutants produced no results; see the step log. Treat this as no coverage.**'
                  exit 0
                fi
                for kind in missed caught unviable timeout; do
                  n=0
                  [ -f "mutants.out/$kind.txt" ] && n=$(wc -l < "mutants.out/$kind.txt" | tr -d ' ')
                  echo "- **$kind**: $n"
                done
                if [ -s mutants.out/missed.txt ]; then
                  echo
                  echo '### Missed: a bug was inserted here and no test noticed'
                  echo
                  echo '```'
                  cat mutants.out/missed.txt
                  echo '```'
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-in-diff
          path: mutants.out
          if-no-files-found: ignore

  slice:
    name: Mutants slice
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Chosen so one slice takes about 10 minutes: see AGENTS.md for the measurement.
      SHARDS: 12
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Install jj
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m755 "$tmp/jj" "$HOME/.local/bin/jj"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jj" --version

      # run_number also advances on PR runs, which skip this job, so consecutive pushes
      # can skip a slice. Coverage is approximate by design; every slice comes round.
      - name: Mutants
        run: |
          set -euo pipefail
          k=$(( ${{ github.run_number }} % SHARDS ))
          echo "$k" > mutants-slice.txt
          echo "Slice $k/$SHARDS"
          rc=0
          cargo mutants --no-shuffle -vV -j2 --shard "$k/$SHARDS" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice::timeouts counted as caught; see mutants.out/timeout.txt"
            rc=0
          fi
          exit "$rc"

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          k="$(cat mutants-slice.txt 2>/dev/null || echo '?')"
          {
            echo "## Mutants slice $k/$SHARDS"
            echo
            if [ ! -d mutants.out ]; then
              echo '**cargo-mutants produced no results; see the step log. Nothing was mutation-tested.**'
              exit 0
            fi
            for kind in missed caught unviable timeout; do
              n=0
              [ -f "mutants.out/$kind.txt" ] && n=$(wc -l < "mutants.out/$kind.txt" | tr -d ' ')
              echo "- **$kind**: $n"
            done
            if [ -s mutants.out/missed.txt ]; then
              echo
              echo '### Missed: a bug was inserted here and no test noticed'
              echo
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-slice
          path: mutants.out
          if-no-files-found: ignore
