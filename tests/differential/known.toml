# Accepted disagreements between specdiff's outline and a framework's own listing.
# tests/differential/main.rs fails on any difference no entry here explains, and on an
# entry that explained nothing in a run over the checked-in corpus.
#
# family: the suite (rust, go, pytest, ...). side: `missing` (the framework lists it,
# specdiff does not) or `extra` (specdiff outlines it, the framework does not list it).
# match: a glob over the identifier `file > group > ... > test [N cases]`.
# Fix a false positive once, here or in the normalisation, never in the comparison.

[[known]]
class = "macro-generated tests"
family = "rust"
side = "missing"
match = "* > *generated*"
reason = "macro_rules! bodies are token trees until expansion; specdiff reads source, not expanded code"

[[known]]
class = "cfg-gated tests"
family = "rust"
side = "extra"
match = "* > only without the extra feature"
reason = "the reference builds with --all-features, so a #[cfg(not(feature))] test is compiled out; specdiff outlines every cfg branch, which is what a reader of the diff wants"

[[known]]
class = "rstest #[values] matrix"
family = "rust"
side = "missing"
match = "* > matrix > * > *"
reason = "rstest expands #[values] into one test per combination, nested in generated modules named from the values; specdiff outlines the function once"

[[known]]
class = "rstest #[values] matrix"
family = "rust"
side = "extra"
match = "* > matrix"
reason = "the other half of the matrix class: specdiff's single spec for the function"

[[known]]
class = "proptest! tests not outlined"
family = "rust"
side = "missing"
match = "* > addition commutes"
reason = "frameworks/rust_proptest.toml's property_based detection is read by no code, and rust_proptest is never selected for a file (it declares no files); see TODO.md"

[[known]]
class = "plain modules inside a test module are flattened"
family = "rust"
side = "missing"
match = "* > tests > inner > *"
reason = "only a #[cfg(test)] mod becomes a group; a plain mod nested in one contributes its tests to the parent group"

[[known]]
class = "plain modules inside a test module are flattened"
family = "rust"
side = "extra"
match = "* > tests > nested module test"
reason = "the other half: the flattened test, one level up"

[[known]]
class = "benchmarks, fuzz targets and examples"
family = "go"
side = "missing"
match = "* > [BFE][a-z]*[A-Z]*"
reason = "go test -list names Benchmark*, Fuzz* and Example* functions alongside tests; specdiff outlines Test* only (a decision: fuzz seeds and examples with output do run under go test)"

[[known]]
class = "build-tagged tests"
family = "go"
side = "extra"
match = "billing/internal > OnlyWithTheIntegrationTag"
reason = "the reference lists the default build, without -tags; specdiff outlines every file whatever its //go:build line"

[[known]]
class = "tests generated at run time"
family = "minitest"
side = "missing"
match = "* > role *"
reason = "define_method in a loop over a literal array names tests only when Ruby runs; specdiff expands `.each` only around DSL calls, not define_method"

[[known]]
class = "test classes found by superclass, not name"
family = "minitest"
side = "missing"
match = "* > BaseCase > *"
reason = "minitest runs every Minitest::Test subclass; specdiff groups classes named Test* or *Test and cannot see a superclass defined elsewhere"

[[known]]
class = "test classes found by superclass, not name"
family = "minitest"
side = "extra"
match = "test/user_test.rb > inherited by every subclass"
reason = "the other half: the base class's test, outlined outside any group"

[[known]]
class = "tests inherited from a superclass"
family = "minitest"
side = "missing"
match = "* > Account > inherited by every subclass"
reason = "minitest runs inherited test methods in every subclass; minitest.toml resolves include/extend only, not superclasses"

[[known]]
class = "namespace modules are not groups"
family = "minitest"
side = "missing"
match = "* > Billing > InvoiceTest > *"
reason = "the reference splits a class name on ::, so Billing::InvoiceTest is two segments; specdiff groups the class only, as its outline shows classes rather than Ruby namespaces"

[[known]]
class = "namespace modules are not groups"
family = "minitest"
side = "extra"
match = "* > InvoiceTest > *"
reason = "the other half: the class without its namespace"
