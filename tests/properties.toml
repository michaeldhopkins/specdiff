# Every source file, classified. `tests/properties.rs` enforces it; the rule is
# "Property Tests for Pure Logic" in the owner's quality ratchets.
#
# A `pure` file's behaviour is a function of its inputs and names the property tests
# (functions inside a `proptest!` block in that file) that cover it. An `effectful`
# file says in a line why it is not pure. A pure file with no properties yet goes in
# `owed`, which may only shrink: an entry that gains a property leaves in the same change.

owed = [
  "src/diff/types.rs",
  "src/output/mod.rs",
  "src/parse/mod.rs",
  "src/parse/registry.rs",
  "src/parse/shared.rs",
  "src/tui/input.rs",
  "src/tui/render.rs",
  "src/tui/state.rs",
  "src/tui/watch.rs",
]

[pure]
"src/cli.rs" = [
  "prints_matches_its_truth_table",
  "prints_round_trips_through_clap_parse",
  "tree_options_is_a_pointwise_isomorphism_of_its_three_flags",
  "tree_options_is_idempotent_and_involutive_under_flag_negation",
]
"src/diff/mod.rs" = [
  "name_similarity_is_symmetric",
  "name_similarity_lives_in_unit_interval_and_is_one_for_equal_inputs",
  "diff_spec_nodes_is_idempotent_for_equal_inputs",
  "filter_file_diffs_keeps_only_files_with_matching_path_or_node_name",
]
"src/diff/types.rs" = []
"src/output/mod.rs" = []
"src/output/truncate.rs" = [
  "truncate_unchanged_runs_matches_a_simple_reference_implementation",
  "truncate_unchanged_runs_is_idempotent",
  "truncate_unchanged_runs_keeps_every_maximal_unchanged_run_within_the_head_plus_tail_plus_one_window",
  "truncate_unchanged_runs_conserves_the_total_number_of_unchanged_items_via_ellipsis_counts",
]
"src/parse/attributes.rs" = [
  "only_the_exact_name_or_one_label_under_it_names_an_attribute",
]
"src/parse/engine.rs" = [
  "groups_and_specs_report_their_one_based_source_line",
  "every_rstest_case_counts_whether_or_not_it_is_described",
]
"src/parse/mod.rs" = []
"src/parse/params.rs" = [
  "a_go_test_is_exactly_a_test_function_taking_a_testing_t",
]
"src/parse/registry.rs" = []
"src/parse/shared.rs" = []
"src/tui/input.rs" = []
"src/tui/render.rs" = []
"src/tui/state.rs" = []
"src/tui/watch.rs" = []

