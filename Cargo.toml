[package]
name = "spec-diff"
version = "0.14.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Show test outline changes on a branch"
repository = "https://github.com/michaeldhopkins/spec-diff"
homepage = "https://github.com/michaeldhopkins/spec-diff"
categories = ["command-line-utilities", "development-tools::testing"]
keywords = ["test", "diff", "tree-sitter", "tui"]
include = ["src/**", "frameworks/**", "examples/**", "build.rs", "LICENSE*", "README.md", "Cargo.lock"]

[[bin]]
name = "spec-diff"
path = "src/main.rs"

[lib]
name = "spec_diff"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
git2 = "0.19"
glob = "0.3"
notify = "7"
notify-debouncer-mini = "0.5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
vcs-runner = "0.12"

[dev-dependencies]
assert_cmd = "2"
clap_complete = "4"
clap_mangen = "0.2"
predicates = "3"
proptest = "1"
tempfile = "3"

[lints.clippy]
struct-excessive-bools = "deny"
fn-params-excessive-bools = "deny"
match_bool = "warn"
bool_to_int_with_if = "warn"
cognitive-complexity = "warn"
too-many-lines = "warn"
collapsible-if = "deny"
too-many-arguments = "deny"
needless-range-loop = "deny"
extend_with_drain = "deny"
unwrap_used = "deny"
